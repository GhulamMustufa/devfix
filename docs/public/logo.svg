<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Vibrant Purple to Cyan Gradient (Electric AI) -->
    <linearGradient id="df-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" /> <!-- Violet -->
      <stop offset="100%" stop-color="#06b6d4" /> <!-- Cyan -->
    </linearGradient>
    
    <!-- Neon Pink to Orange Gradient (Cyber Sunset) -->
    <linearGradient id="df-grad-2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" /> <!-- Pink -->
      <stop offset="100%" stop-color="#f97316" /> <!-- Orange -->
    </linearGradient>

    <!-- Deep Blue Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Side: The "D" spine -->
  <path d="M 120 90 C 120 70 140 60 160 70 L 160 330 C 140 340 120 330 120 310 Z" fill="url(#df-grad-1)" />

  <!-- Outer curve of the "D" -->
  <path d="M 150 90 L 220 90 C 290 90 320 140 320 200 C 320 260 290 310 220 310 L 150 310 L 150 250 L 220 250 C 250 250 260 230 260 200 C 260 170 250 150 220 150 L 150 150 Z" fill="url(#df-grad-1)" filter="url(#shadow)" />

  <!-- The "F" top crossbar (overlapping the D) -->
  <path d="M 210 110 L 320 110 C 340 110 350 130 330 140 L 210 140 Z" fill="url(#df-grad-2)" filter="url(#shadow)" />

  <!-- The "F" middle crossbar (overlapping the D) -->
  <path d="M 210 180 L 290 180 C 310 180 320 200 300 210 L 210 210 Z" fill="url(#df-grad-2)" filter="url(#shadow)" />

</svg>
